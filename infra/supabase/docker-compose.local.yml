# In local Compose, configure service-role passwords from the
# pinned upstream roles.sql before any dependent service uses them.
# The bootstrap is one-shot and must finish successfully.
services:
  auth:
    depends_on:
      panda-db-roles:
        condition: service_completed_successfully
    healthcheck:
      start_period: 60s
      retries: 12

  rest:
    depends_on:
      panda-db-roles:
        condition: service_completed_successfully

  storage:
    depends_on:
      panda-db-roles:
        condition: service_completed_successfully

  realtime:
    depends_on:
      panda-db-roles:
        condition: service_completed_successfully
