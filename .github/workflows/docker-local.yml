name: Panda local Docker configuration

on:
  pull_request:
    paths:
      - "compose.local.yaml"
      - "infra/local/**"
      - "scripts/docker-local-regression.test.cjs"
      - ".github/workflows/docker-local.yml"
  push:
    branches:
      - infra/local-stack
    paths:
      - "compose.local.yaml"
      - "infra/local/**"
      - "scripts/docker-local-regression.test.cjs"
      - ".github/workflows/docker-local.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-compose-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          bash -n infra/local/init.sh
          node scripts/docker-local-regression.test.cjs
      - name: Prepare disposable configuration
        run: bash infra/local/init.sh
      - name: Validate complete Compose model
        run: |
          docker compose -f compose.local.yaml --env-file .env.docker config --quiet
          docker compose -f compose.local.yaml --env-file .env.docker config --format json > "$RUNNER_TEMP/panda-local-compose.json"
          node - "$RUNNER_TEMP/panda-local-compose.json" <<'NODE'
          const fs = require("fs");
          const model = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          for (const name of ["panda-web", "panda-proxy", "api-gw", "auth", "rest", "db", "storage"])
            if (!model.services[name]) throw new Error("Missing service: " + name);
          if (model.services["panda-scheduler"]) throw new Error("Scheduler must remain disabled");
          // Check effective interpolation without printing any real credentials.
          const password = model.services.db.environment.POSTGRES_PASSWORD;
          const authDb = new URL(model.services.auth.environment.GOTRUE_DB_DATABASE_URL);
          const restDb = new URL(model.services.rest.environment.PGRST_DB_URI);
          if (!password || password.length < 24) throw new Error("Missing effective PostgreSQL password");
          if (authDb.password !== password || restDb.password !== password)
            throw new Error("Supabase services disagree on PostgreSQL credentials");
          for (const [name, service] of Object.entries(model.services)) {
            for (const port of service.ports ?? []) {
              if (port.host_ip !== "127.0.0.1")
                throw new Error("Public port in " + name);
            }
          }
          console.log("PASS: complete local Compose with loopback-only exposure");
          NODE
      - name: Boot actual local stack (disposable test data only)
        shell: bash
        timeout-minutes: 35
        run: |
          cleanup() {
            docker compose -f compose.local.yaml --env-file .env.docker ps -a || true
            docker compose -f compose.local.yaml --env-file .env.docker logs --tail=100 panda-web panda-proxy auth api-gw db || true
            docker compose -f compose.local.yaml --env-file .env.docker down --volumes --remove-orphans || true
            docker network rm panda_shared || true
          }
          trap cleanup EXIT
          timeout 1500s docker compose -f compose.local.yaml --env-file .env.docker up -d --build --wait
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/login >/dev/null
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/auth/v1/health >/dev/null
          echo "PASS: local web, proxy and Supabase Auth respond on the same entrypoint"
